[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stamm"
version = "0.1.0"
description = "A fast, mutt-like terminal Maildir client"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
stamm = "stamm.__main__:main"

[tool.setuptools.packages.find]
include = ["stamm*"]


[tool.mypy]
python_version = "3.12"
strict = true
packages = ["stamm"]
